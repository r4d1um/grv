name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GO111MODULE: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.13.15
          cache: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            patch \
            libncurses-dev \
            libreadline-dev \
            libgpm-dev

      - name: Prepare legacy GOPATH workspace
        run: |
          GOPATH_DIR="$(go env GOPATH)"
          mkdir -p "$GOPATH_DIR/src/github.com/rgburke"
          cp -a "$GITHUB_WORKSPACE" "$GOPATH_DIR/src/github.com/rgburke/grv"

      - name: Build, generate docs and test
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make grv
          make doc
          go test --tags static ./cmd/grv

      - name: Build static binary
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make clean
          make static

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          SRC="$(go env GOPATH)/src/github.com/rgburke/grv"
          ASSET="grv_${TAG}_linux64"
          cp "$SRC/grv" "$ASSET"
          ./"$ASSET" -version
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
