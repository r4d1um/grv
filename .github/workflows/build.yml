name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag and release this commit (e.g. v0.3.4); leave empty for a plain build"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GO111MODULE: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Tag commit for manual release
        if: inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like v1.2.3, got '$TAG'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
          # local only, so `git describe` puts the version into the binary; the release job creates the real tag
          git tag "$TAG" "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.13.15
          cache: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            patch \
            libncurses-dev \
            libreadline-dev \
            libgpm-dev

      - name: Prepare legacy GOPATH workspace
        run: |
          GOPATH_DIR="$(go env GOPATH)"
          mkdir -p "$GOPATH_DIR/src/github.com/rgburke"
          cp -a "$GITHUB_WORKSPACE" "$GOPATH_DIR/src/github.com/rgburke/grv"

      - name: Build, generate docs and test
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make grv
          make doc
          go test --tags static ./cmd/grv

      - name: Build static binary
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make clean
          make static
          ./grv -version
          cp grv "$GITHUB_WORKSPACE/grv_linux64"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: grv_linux64
          path: grv_linux64
          retention-days: 7

  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GO111MODULE: "off"
      # libgit2 v0.27 declares an ancient cmake_minimum_required; CMake 4 needs this to configure it
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Tag commit for manual release
        if: inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag }}
        # local only, so `git describe` puts the version into the binary; validated in the build job
        run: git tag "$TAG" "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Install native dependencies
        run: |
          brew install cmake pkg-config readline ncurses
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix readline)/lib/pkgconfig"
            echo "CGO_CFLAGS=-I$(brew --prefix ncurses)/include -I$(brew --prefix readline)/include"
            echo "CGO_LDFLAGS=-L$(brew --prefix ncurses)/lib -L$(brew --prefix readline)/lib"
          } >> "$GITHUB_ENV"

      - name: Prepare legacy GOPATH workspace
        run: |
          GOPATH_DIR="$(go env GOPATH)"
          mkdir -p "$GOPATH_DIR/src/github.com/rgburke"
          cp -a "$GITHUB_WORKSPACE" "$GOPATH_DIR/src/github.com/rgburke/grv"

      - name: Build and test
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make apply-patches
          # The zlib bundled in libgit2 v0.27 redefines fdopen on macOS, which clashes with current SDK headers
          ZUTIL=cmd/grv/vendor/gopkg.in/libgit2/git2go.v27/vendor/libgit2/deps/zlib/zutil.h
          perl -pi -e 's/defined\(MACOS\) \|\| defined\(TARGET_OS_MAC\)/defined(MACOS)/' "$ZUTIL"
          if grep -n 'TARGET_OS_MAC' "$ZUTIL"; then
            echo "::error::zlib fdopen patch did not apply"; exit 1
          fi
          make build-only
          go test --tags static ./cmd/grv

      - name: Inspect binary
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          file grv
          otool -L grv
          # only system libraries and Homebrew's readline/ncurses, which the formula depends on
          if otool -L grv | tail -n +2 | awk '{print $1}' \
              | grep -vE '^/usr/lib/|^/System/|^/opt/homebrew/opt/(readline|ncurses)/'; then
            echo "::error::unexpected dynamic library dependency"; exit 1
          fi
          ./grv -version
          cp grv "$GITHUB_WORKSPACE/grv_darwin_arm64"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: grv_darwin_arm64
          path: grv_darwin_arm64
          retention-days: 7

  release:
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd dist
          assets=()
          for platform in linux64 darwin_arm64; do
            asset="grv_${TAG}_${platform}"
            mv "grv_${platform}" "$asset"
            chmod +x "$asset"
            sha256sum "$asset" > "$asset.sha256"
            assets+=("$asset" "$asset.sha256")
          done
          cat ./*.sha256
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
