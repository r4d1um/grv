name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag and release this commit (e.g. v0.3.3); leave empty for a plain build"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GO111MODULE: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Tag commit for manual release
        if: inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like v1.2.3, got '$TAG'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.13.15
          cache: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            patch \
            libncurses-dev \
            libreadline-dev \
            libgpm-dev

      - name: Prepare legacy GOPATH workspace
        run: |
          GOPATH_DIR="$(go env GOPATH)"
          mkdir -p "$GOPATH_DIR/src/github.com/rgburke"
          cp -a "$GITHUB_WORKSPACE" "$GOPATH_DIR/src/github.com/rgburke/grv"

      - name: Build, generate docs and test
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make grv
          make doc
          go test --tags static ./cmd/grv

      - name: Build static binary
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make clean
          make static

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          SRC="$(go env GOPATH)/src/github.com/rgburke/grv"
          ASSET="grv_${TAG}_linux64"
          cp "$SRC/grv" "$ASSET"
          ./"$ASSET" -version
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GO111MODULE: "off"
      # libgit2 v0.27 declares an ancient cmake_minimum_required; CMake 4 needs this to configure it
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Install native dependencies
        run: |
          brew install cmake pkg-config readline ncurses
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix readline)/lib/pkgconfig"
            echo "CGO_CFLAGS=-I$(brew --prefix ncurses)/include -I$(brew --prefix readline)/include"
            echo "CGO_LDFLAGS=-L$(brew --prefix ncurses)/lib -L$(brew --prefix readline)/lib"
          } >> "$GITHUB_ENV"

      - name: Prepare legacy GOPATH workspace
        run: |
          GOPATH_DIR="$(go env GOPATH)"
          mkdir -p "$GOPATH_DIR/src/github.com/rgburke"
          cp -a "$GITHUB_WORKSPACE" "$GOPATH_DIR/src/github.com/rgburke/grv"

      - name: Build and test
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make grv
          go test --tags static ./cmd/grv

      - name: Inspect binary
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          file grv
          otool -L grv
          ./grv -version
          cp grv "$GITHUB_WORKSPACE/grv_darwin_arm64"

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: grv_darwin_arm64
          path: grv_darwin_arm64
          retention-days: 7
