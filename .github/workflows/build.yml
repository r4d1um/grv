name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GO111MODULE: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.13.15
          cache: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            patch \
            libncurses-dev \
            libreadline-dev \
            libgpm-dev

      - name: Prepare legacy GOPATH workspace
        run: |
          GOPATH_DIR="$(go env GOPATH)"
          mkdir -p "$GOPATH_DIR/src/github.com/rgburke"
          cp -a "$GITHUB_WORKSPACE" "$GOPATH_DIR/src/github.com/rgburke/grv"

      - name: Build and test
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make test

      - name: Build static binary
        run: |
          cd "$(go env GOPATH)/src/github.com/rgburke/grv"
          make clean
          make static
